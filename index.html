<!DOCTYPE html>
<html>
<head>
    <title>Dla Mojej Miłości ❤️</title>
    <style>
        body { 
            background: #ffe6f2; 
            text-align: center; 
            font-family: 'Arial', sans-serif; 
        }
        .heart { 
            color: #ff3366; 
            font-size: 50px; 
            animation: pulse 1s infinite; 
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>❤️ Dla [Jej Imię] ❤️</h1>
    <p>Jesteś światłem mojego życia...</p>
    <div class="heart">❤️</div>
    <img src="wasze-zdjecie.jpg" width="300" style="border-radius: 15px;">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</body>
</html>
