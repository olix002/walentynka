<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Walentynka ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFD1DC;
            overflow: hidden;
            touch-action: none;
        }

        .top-text {
            position: fixed;
            top: 20px;
            font-family: 'Arial', sans-serif;
            color: #C71585;
            font-size: 1.2rem;
            text-align: center;
            width: 100%;
            z-index: 4;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: #C71585;
            text-shadow: 2px 2px 4px rgba(199, 21, 133, 0.3);
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            margin-bottom: 30px;
            animation: fadeIn 2s ease-out;
        }

        .hearts {
            display: flex;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        .heart {
            font-size: clamp(4rem, 15vw, 6rem);
            animation: pulse 1.5s infinite;
            color: #FF1493;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-heart {
            position: fixed;
            opacity: 0.15;
            font-size: 20px;
            animation: floating 12s linear infinite;
            z-index: 1;
        }

        @keyframes floating {
            0% { transform: translate(0, 150vh) rotate(0deg); }
            100% { transform: translate(calc(-100vw + 50px), -50vh) rotate(360deg); }
        }

        .magic-button {
            position: fixed;
            bottom: 30px;
            background: #FF69B4;
            color: white;
            width: 200px;
            height: 60px;
            border-radius: 30px;
            border: none;
            font-family: 'Arial', sans-serif;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s, background 0.3s;
            z-index: 3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .magic-button:hover {
            transform: scale(1.05);
            background: #FF1493;
        }

        .kiss {
            position: fixed;
            top: -50px;
            font-size: 40px;
            animation: fall 1.5s linear forwards;
            opacity: 0.8;
            z-index: 2;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-hearts"></div>
    
    <div class="top-text">Od Twojego mężusia</div>

    <div class="container">
        <h1>Dla Mojej Kochanej Walentynki</h1>
        <div class="hearts">
            <div class="heart">❤️</div>
        </div>
    </div>

    <button class="magic-button">Kliknij mnie!</button>

    <script>
        function createBgHearts() {
            const container = document.body;
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = Math.random() * 20 + 15 + 'px';
                container.appendChild(heart);
            }
        }
        createBgHearts();

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        function createKisses() {
            const numberOfKisses = 30;
            const animationDuration = 1500;
            const kisses = ['💋', '😘'];

            for (let i = 0; i < numberOfKisses; i++) {
                const kiss = document.createElement('div');
                kiss.className = 'kiss';
                kiss.textContent = kisses[Math.floor(Math.random() * kisses.length)];
                kiss.style.left = Math.random() * 95 + 'vw';
                kiss.style.animation = `fall ${Math.random() * 1 + 1}s linear forwards`;
                document.body.appendChild(kiss);

                setTimeout(() => kiss.remove(), animationDuration);
            }
        }

        document.querySelector('.magic-button').addEventListener('click', function() {
            this.disabled = true;
            createKisses();
            setTimeout(() => this.disabled = false, 1500);
        });
    </script>
</body>
</html>
