<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <!-- Dodane meta tagi do kontroli powiększania -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Walentynka ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            /* Blokada selekcji tekstu/zdjęć */
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #FFD1DC;
            overflow-x: hidden;
            touch-action: pan-y; /* Blokada gestów powiększania */
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: #C71585;
            text-shadow: 2px 2px 4px rgba(199, 21, 133, 0.3);
            margin: 20px 0;
            font-size: 2.5rem; /* Nowa jednostka rem zamiast vw */
            line-height: 1.2;
        }

        .hearts {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        .heart {
            font-size: 2.5rem; /* Responsywne jednostki */
            animation: pulse 1.5s infinite;
        }

        /* Kolory serduszek */
        .heart:nth-child(1) { color: #FF69B4; }
        .heart:nth-child(2) { color: #FF1493; }
        .heart:nth-child(3) { color: #DB7093; }
        .heart:nth-child(4) { color: #FFB6C1; }

        /* Animacje bez zmian */
        @keyframes pulse { /* ... */ }
        @keyframes float { /* ... */ }
        @keyframes fadeIn { /* ... */ }

        /* Media queries dla telefonów */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem; /* Mniejszy tekst na telefonach */
                margin: 10px 0;
            }
            
            .heart {
                font-size: 2rem; /* Mniejsze serduszka */
            }

            .bg-heart {
                font-size: 14px !important; /* Mniejsze serca w tle */
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem; /* Ekstra małe ekrany */
            }
        }
    </style>
</head>
<body>
    <div class="bg-hearts"></div>
    <div class="container">
        <h1>Dla Mojej Kochanej Walentynki</h1>
        <div class="hearts">
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
        </div>
    </div>

    <script>
        // Zmodyfikowany skrypt dla mniejszych serc w tle
        function createBgHearts() {
            const container = document.querySelector('.bg-hearts');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 10 + 8) + 'px'; // Mniejsze serca
                heart.style.animationDuration = (Math.random() * 5 + 8) + 's';
                container.appendChild(heart);
            }
        }
        createBgHearts();
    </script>
</body>
</html>
