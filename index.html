<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walentynka dla Ciebie ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #FFD1DC; /* Pudrowy róż */
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4vw;
            color: #C71585; /* Ciemny róż */
            text-shadow: 2px 2px 4px rgba(199, 21, 133, 0.3);
            margin: 20px 0;
            animation: fadeIn 2s ease-out;
        }

        .hearts {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        .heart {
            font-size: 40px;
            animation: pulse 1.5s infinite;
        }

        /* Kolory serduszek */
        .heart:nth-child(1) { color: #FF69B4; } /* Hot pink */
        .heart:nth-child(2) { color: #FF1493; } /* Deep pink */
        .heart:nth-child(3) { color: #DB7093; } /* Pale violet red */
        .heart:nth-child(4) { color: #FFB6C1; } /* Light pink */

        /* Animacje */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efekt unoszących się serduszek w tle */
        .bg-heart {
            position: absolute;
            opacity: 0.3;
            animation: floating 10s infinite linear;
        }

        @keyframes floating {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Tło z unoszącymi się serduszkami -->
    <div class="bg-hearts">
        <!-- JavaScript doda tutaj automatycznie serduszka -->
    </div>

    <div class="container">
        <h1>Dla Mojej Kochanej Walentynki</h1>
        <div class="hearts">
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
        </div>
    </div>

    <script>
        // Generowanie unoszących się serduszek w tle
        function createBgHearts() {
            const container = document.querySelector('.bg-hearts');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 20 + 10 + 'px';
                heart.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(heart);
            }
        }
        createBgHearts();
    </script>
</body>
</html>
