<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Walentynka ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFD1DC;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: #C71585;
            text-shadow: 2px 2px 4px rgba(199, 21, 133, 0.3);
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            margin-bottom: 30px;
            animation: fadeIn 2s ease-out;
        }

        .hearts {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        .heart {
            font-size: clamp(2rem, 8vw, 3rem);
            animation: pulse 1.5s infinite;
        }

        /* Kolory serduszek */
        .heart:nth-child(1) { color: #FF69B4; }
        .heart:nth-child(2) { color: #FF1493; }
        .heart:nth-child(3) { color: #DB7093; }
        .heart:nth-child(4) { color: #FFB6C1; }

        /* Animacje */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animowane tło */
        .bg-heart {
            position: fixed;
            opacity: 0.15;
            font-size: 20px;
            animation: floating 12s linear infinite;
            z-index: 1;
        }

        @keyframes floating {
            0% {
                transform: translate(0, 150vh) rotate(0deg);
            }
            100% {
                transform: translate(calc(-100vw + 50px), -50vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="bg-hearts"></div>
    
    <div class="container">
        <h1>Dla Mojej Kochanej Walentynki </h1>
        <div class="hearts">
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
            <div class="heart">❤️</div>
        </div>
    </div>

    <script>
        // Generowanie serc w tle
        function createBgHearts() {
            const container = document.body;
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = Math.random() * 20 + 15 + 'px';
                container.appendChild(heart);
            }
        }
        createBgHearts();

        // Blokada zoomu
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
